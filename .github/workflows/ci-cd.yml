name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, cursor ]
  pull_request:
    branches: [ main, develop, cursor ]

env:
  NODE_VERSION: '18'
  EXPO_VERSION: 'latest'

jobs:
  # 🧪 Test & Lint Job
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint || echo "Linting done"

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # 📦 Android Build (APK + AAB)
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to EAS
        run: echo "${{ secrets.EXPO_TOKEN }}" | eas login --non-interactive

      - name: Build APK (preview)
        run: eas build --platform android --profile preview --non-interactive

      - name: Build AAB (production)
        run: eas build --platform android --profile production --non-interactive

  # 🍎 iOS Build
  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to EAS
        run: echo "${{ secrets.EXPO_TOKEN }}" | eas login --non-interactive

      - name: Build iOS (preview)
        run: eas build --platform ios --profile preview --non-interactive

  # 🚀 Deploy OTA (expo update)
  deploy-updates:
    name: Publish OTA Updates
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to EAS
        run: echo "${{ secrets.EXPO_TOKEN }}" | eas login --non-interactive

      - name: Publish OTA to production
        run: eas update --branch production --message "Auto-deploy from GitHub CI"

  # 🔐 Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
